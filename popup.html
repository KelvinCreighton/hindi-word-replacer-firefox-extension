<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 220px;
      font-family: 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }

    h1 {
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #e07b39;
      margin-bottom: 14px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }

    /* Toggle switch */
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #e07b39; }
    input:checked + .slider::before { transform: translateX(18px); }

    .count {
      margin-top: 12px;
      font-size: 11px;
      color: #888;
    }
    .count span { color: #e07b39; font-weight: bold; }

    .difficulty-group {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .difficulty-group p {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .difficulty-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .difficulty-group input {
      accent-color: #e07b39;
    }

    .site-group {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .site-group p {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .site-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .site-group input[type="radio"] {
      accent-color: #e07b39;
    }
    .site-group textarea {
      width: 100%;
      min-height: 54px;
      resize: vertical;
      margin-top: 6px;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #11111d;
      color: #eee;
      font: inherit;
      font-size: 12px;
    }
    .site-group textarea:disabled {
      opacity: 0.45;
    }
    .site-note {
      font-size: 11px;
      color: #999;
      margin-bottom: 8px;
      line-height: 1.35;
    }
    .site-button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      background: #e07b39;
      color: #111;
      padding: 9px 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .site-button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>
<body>
  <h1>Hindi Replacer</h1>

  <div class="row">
    <span>Active on this tab</span>
    <label class="toggle">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="difficulty-group" id="mode-selector">
    <p>Difficulty Mode</p>
    <label><input type="radio" name="mode" value="easy"> Easy (Nouns)</label>
    <label><input type="radio" name="mode" value="normal" checked> Normal (Phrases)</label>
    <label><input type="radio" name="mode" value="hard"> Hard (Sentences)</label>
  </div>

  <div class="site-group">
    <p>Site Scope</p>
    <label><input type="radio" name="site-scope" value="all" checked> All sites except these</label>
    <textarea id="all-except-list" placeholder="example.com&#10;news.site"></textarea>

    <label><input type="radio" name="site-scope" value="none"> No sites except these</label>
    <textarea id="none-except-list" placeholder="docs.example.com&#10;wikipedia.org"></textarea>

    <div class="site-note">Current site: <span id="current-site">Loading...</span></div>
    <button type="button" class="site-button" id="current-site-toggle">Loading...</button>
  </div>

  <p class="count">
    Shabd (Words) in database: <span id="word-count"></span>
  </p>

  <script src="words.js"></script>
  <script src="popup.js"></script>
</body>
</html>
